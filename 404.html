<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Poppins & Anton -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Abstract Background Effect -->
    <div class="background-effect"></div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="name reveal">404</h1>
        <span class="badge reveal">Not found.</span>
        <p class="description reveal">The page you were looking for doesn't exist.</p>

        <div class="cta-section reveal">
            <div class="cta-buttons">
                <a href="https://cakramnsy.com" class="portfolio-button">Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Search/Link Element (Bottom Left) -->
    <div class="search-link reveal">
        <a href="https://cakramnsy.com" target="_blank" rel="noopener noreferrer">
            <span>cakramnsy.com</span>
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
    </div>
</body>
</html>
